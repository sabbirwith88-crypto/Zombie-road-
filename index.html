.input{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:16px;outline:none;margin-bottom:12px}

label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}

<script>
(function(){
'use strict';
var CONFIG={
  botLink:'https://t.me/binanceredpacket01_bot',
  channelLink:'https://t.me/binanaceredpacketcommubity',
  channelUser:'binanaceredpacketcommubity',

  youtubeLink:'https://www.youtube.com/',   // PUT your "How to get Red Packet code" YouTube link here
  adminPassword:'1477653897',

  codeOpenSec:30,
  adsgramBlockId:'int-28543',
  adexiumWid:'999e0d65-89f3-4f68-a33a-aa4d0d30a634'
};
var $=function(s){return document.querySelector(s)};
var tg=window.Telegram&&Telegram.WebApp;
var PREVIEW=/[?&]preview\b/.test(location.search);
var S={uid:null,user:{},tasks:{},view:'home',busy:false,cd:null};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function hap(k){try{k==='tap'?tg.HapticFeedback.impactOccurred('light'):tg.HapticFeedback.notificationOccurred(k)}catch(e){}}
var tT;function toast(m,err){var t=$('#toast');t.textContent=m;t.className=err?'err':'';t.hidden=false;clearTimeout(tT);tT=setTimeout(function(){t.hidden=true},2600);hap(err?'error':'success')}
function openLink(u){try{if(/^https:\/\/t\.me\//.test(u)&&tg&&tg.openTelegramLink)return tg.openTelegramLink(u);if(tg&&tg.openLink)return tg.openLink(u)}catch(e){}window.open(u,'_blank')}
function copy(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).then(function(){toast('Copied!')},fb)}
  fb();function fb(){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied!')}catch(e){toast('Copy failed',true)}a.remove()}
}
var YT='<svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#FF0000"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>';
var TGI='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#229ED9"/><path d="M5.5 11.8l11.4-4.4c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.9-2.1-1.4 1.4c-.2.2-.3.3-.6.3l.2-3 5.4-4.9c.2-.2 0-.3-.4-.1l-6.7 4.2-2.9-.9c-.6-.2-.6-.6.1-.9z" fill="#fff"/></svg>';
var IC={play:'<svg class="ic sm" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4.5v15l13-7.5z"/></svg>',check:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',back:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>',pkt:'<svg class="ic sm" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9c4 4 10 4 14 0"/><circle cx="12" cy="12" r="1.6"/></svg>'};
var LOGO='<svg class="logo" viewBox="0 0 126 126" fill="#F0B90B"><path d="M38.171 53.203L62.999 28.375l24.835 24.835 14.446-14.448L62.999 0 23.725 39.275l14.446 14.448zM0 63l14.448-14.448L28.896 63 14.448 77.448zm38.171 9.797L62.999 97.625l24.827-24.826 14.454 14.44-.008.008L62.999 126l-39.274-39.274-.02-.02 14.466-14.434zM97.104 63l14.448-14.448L126 63l-14.448 14.448zM77.239 62.987h.012L62.999 48.735 52.46 59.274l-1.213 1.213-2.49 2.49-.02.02.02.02L62.999 77.265l14.252-14.252.008-.014-.02-.012z"/></svg>';

/* Firebase */
var db,TS;
try{
  firebase.initializeApp({apiKey:"AIzaSyAmTdb5ejQtgYxmkfLc575HcBN8pMhrBPM",authDomain:"earn-for-earn-55d3e.firebaseapp.com",databaseURL:"https://earn-for-earn-55d3e-default-rtdb.firebaseio.com",projectId:"earn-for-earn-55d3e",storageBucket:"earn-for-earn-55d3e.firebasestorage.app",messagingSenderId:"109416949734",appId:"1:109416949734:web:53f52de7899d65a04c9827"});
  db=firebase.database();TS=firebase.database.ServerValue.TIMESTAMP;
}catch(e){console.error(e)}
var uref=function(id){return db.ref('rp/users/'+(id||S.uid))};

/* Ads: 1 = Adsgram, 2 = Monetag, 3 = Adexium */
async function waitFn(n){for(var i=0;i<60;i++){if(typeof window[n]==='function')return true;await sleep(200)}throw new Error('not_ready')}
async function runAdsgram(){
  if(!window.Adsgram)throw new Error('not_ready');
  var c=window.Adsgram.init({blockId:CONFIG.adsgramBlockId});
  await Promise.race([c.show(),new Promise(function(_,j){setTimeout(function(){j(new Error('timeout'))},120000)})]);
}
async function runMonetag(){await waitFn('show_10541383');var r=window.show_10541383();if(r&&r.then)await r}
var adx=null,adxRes=null,adxRej=null;
async function runAdexium(){
  if(typeof window.AdexiumWidget==='undefined')throw new Error('not_ready');
  if(!adx){
    adx=new window.AdexiumWidget({wid:CONFIG.adexiumWid,adFormat:'interstitial'});
    ['adComplete','close','complete'].forEach(function(ev){try{adx.on(ev,function(){adxRes&&adxRes()})}catch(e){}});
    try{adx.on('adError',function(e){adxRej&&adxRej(e)})}catch(e){}
  }
  await new Promise(function(res,rej){
    var done=false;
    adxRes=function(){if(!done){done=true;res()}};
    adxRej=function(e){if(!done){done=true;rej(e instanceof Error?e:new Error('failed'))}};
    var f=adx.showAd||adx.show||adx.display;
    if(typeof f==='function'){var r=f.call(adx);if(r&&r.then)r.then(adxRes).catch(adxRej);setTimeout(adxRes,90000)}
    else if(typeof adx.autoMode==='function'){adx.autoMode();setTimeout(adxRes,30000)}
    else adxRej(new Error('no_method'));
  });
  adxRes=adxRej=null;
}
async function runAd1(){
  try{await runAdsgram()}
  catch(e){
    if(e&&typeof e==='object'&&e.error===false&&e.done===false)throw new Error('skipped');
    await runMonetag();
  }
}
var ADS=[{n:'Ad 1',run:runAd1},{n:'Ad 2',run:runMonetag},{n:'Ad 3',run:runAdexium}];

/* Channel verification */
async function verify(manual){
  if(!CONFIG.botToken){if(manual)store.set('rp_joined','1');return store.get('rp_joined')==='1'}
  try{
    var r=await fetch('https://api.telegram.org/bot'+CONFIG.botToken+'/getChatMember?chat_id=@'+CONFIG.channelUser+'&user_id='+S.uid);
    var j=await r.json();if(!j.ok)return null;
    var st=(j.result||{}).status;
    return ['member','administrator','creator'].indexOf(st)>=0||(st==='restricted'&&j.result.is_member);
  }catch(e){return null}
}

/* User */
async function ensureUser(tu){
  var ref=uref(),snap=await ref.once('value');
  var prof={name:((tu.first_name||'')+' '+(tu.last_name||'')).trim()||tu.username||'User',username:tu.username||''};
  if(snap.exists())return ref.update(prof);
  var sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param,by=null;
  if(sp&&/^\d+$/.test(sp)&&sp!==S.uid){var r=await uref(sp).child('name').once('value');if(r.exists())by=sp}
  await ref.set(Object.assign({points:0,unlocked:0,invited:0,createdAt:TS,referredBy:by},prof));
  if(by){
    uref(by).child('points').transaction(function(p){return (p||0)+CONFIG.refPoints});
    uref(by).child('invited').transaction(function(p){return (p||0)+1});
  }
}

/* Views */
function visibleTasks(){
  var done=S.user.done||{},out=[];
  Object.keys(S.tasks).forEach(function(id){var t=S.tasks[id];if(t&&!done[id]&&(t.used||0)<t.limit)out.push(Object.assign({id:id},t))});
  return out.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
}

  var u=S.user,tasks=visibleTasks();

   '<button class="how" id="howBtn"><span class="em">'+YT+'</span><div><b>How to get Red Packet Code</b><span>Tap to watch the YouTube guide</span></div></button>'+
   '<div class="card info"><h3>Information</h3><ul><li>Open the Packet tab and pick a task.</li><li>Tap Get Code, then watch 3 ads to unlock the code.</li><li>Copy the code and paste it in Binance Red Packet.</li><li>Invite friends to earn points and unlock codes without ads.</li><li>New codes are added regularly, so check back often.</li></ul></div>'+
   '<button class="how" id="joinBtn"><span class="tg">'+TGI+'</span><div><b>Join Community</b><span>Join our public Telegram community</span></div></button>'+
   '<button class="btn b-gold" style="width:100%" id="goPacket">'+IC.pkt+' Packet</button>';
  $('#joinBtn').onclick=function(){hap('tap');openLink(CONFIG.channelLink)};
  $('#howBtn').onclick=function(){hap('tap');openLink(CONFIG.youtubeLink)};
  $('#goPacket').onclick=function(){go('packet')};

  $('#v-packet').innerHTML='<h1 class="pt">Packets</h1><p class="sub">Pick a task and unlock its Red Packet code.</p>'+(tasks.length?tasks.map(function(t){
    return '<div class="card task"><h3 class="th">'+LOGO+'<span>'+esc(t.title)+'</span></h3><p>'+esc(t.desc)+'</p><div class="m"><span class="pill">Left: '+(t.limit-(t.used||0))+'</span><button class="btn b-gold" data-code="'+t.id+'">Get Code</button></div></div>'}).join(''):'<div class="empty">'+IC.pkt+'<br>No packets available right now.<br>Please check back later.</div>');
  [].forEach.call(document.querySelectorAll('[data-code]'),function(b){b.onclick=function(){openCode(b.dataset.code)}});

  var link=CONFIG.botLink+'?startapp='+S.uid;
  $('#v-invite').innerHTML='<h1 class="pt" id="invTitle">Invite Friends</h1><p class="sub">Each friend you invite gives you <b>'+CONFIG.refPoints+' points</b>. '+CONFIG.unlockCost+' point unlocks 1 code with no ads.</p>'+
   '<div class="grid3"><div class="st"><b>'+(u.invited||0)+'</b><span>Invited</span></div><div class="st"><b>'+(u.points||0)+'</b><span>Points</span></div><div class="st"><b>'+Math.floor((u.points||0)/CONFIG.unlockCost)+'</b><span>Free unlocks</span></div></div>'+
   '<div class="card"><b>Your invite link</b><div class="link">'+esc(link)+'</div><div class="btns" style="max-width:none"><button class="btn b-gold" id="shareBtn">Invite Friends</button><button class="btn b-dark" id="cpLink">Copy Link</button></div></div>';
  $('#shareBtn').onclick=function(){openLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Get Binance Red Packet codes here!'))};
  $('#cpLink').onclick=function(){copy(link)};
  var taps=0,lt=0;
  $('#invTitle').onclick=function(){var n=Date.now();taps=(n-lt<450)?taps+1:1;lt=n;if(taps>=2){taps=0;$('#pwIn').value='';$('#pwModal').hidden=false;setTimeout(function(){$('#pwIn').focus()},50)}};
}
function go(v){
  if(S.cd){clearInterval(S.cd);S.cd=null}
  $('#codeView').hidden=true;S.view=v;
  ['home','packet','invite'].forEach(function(x){$('#v-'+x).hidden=x!==v});
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.go===v)});
  window.scrollTo(0,0);
}

/* Code unlock */
function openCode(id){
  var t=S.tasks[id];if(!t)return;
  var got=[false,false,false],cv=$('#codeView');cv.hidden=false;
  function draw(){
    var pts=S.user.points||0;
    cv.innerHTML='<div class="in"><button class="btn b-dark" id="cvBack" style="margin-bottom:14px">'+IC.back+' Back</button>'+
     '<div class="card task"><h3 class="th">'+LOGO+'<span>'+esc(t.title)+'</span></h3><p>'+esc(t.desc)+'</p></div>'+
     '<div class="card"><b>Watch 3 ads</b><p class="sub" style="margin:4px 0 12px">Watch all 3 ads to unlock the code.</p>'+
     ADS.map(function(a,i){return '<div class="adrow"><button class="btn '+(got[i]?'b-ok':'b-gold')+'" data-ad="'+i+'" '+(got[i]||S.busy?'disabled':'')+'>'+(got[i]?IC.check+' '+a.n+' watched':IC.play+' '+a.n)+'</button></div>'}).join('')+'</div>'+
     '<div class="or">— or —</div>'+
     '<button class="btn b-dark" style="width:100%" id="ptUnlock" '+(pts<CONFIG.unlockCost||S.busy?'disabled':'')+'>Unlock with '+CONFIG.unlockCost+' point (you have '+pts+')</button></div>';
    $('#cvBack').onclick=function(){go('packet')};
    [].forEach.call(cv.querySelectorAll('[data-ad]'),function(b){b.onclick=function(){watch(+b.dataset.ad)}});
    $('#ptUnlock').onclick=function(){finish(true)};
  }
  async function watch(i){
    if(S.busy)return;S.busy=true;draw();
    try{await ADS[i].run();got[i]=true;hap('success')}
    catch(e){toast('Ad not completed. Please try again.',true)}
    S.busy=false;draw();
    if(got.every(Boolean))finish(false);
  }
  async function finish(viaPts){
    if(S.busy&&viaPts)return;S.busy=true;
    try{
      if(viaPts){
        var ok=await uref().child('points').transaction(function(p){return (p||0)>=CONFIG.unlockCost?p-CONFIG.unlockCost:undefined});
        if(!ok.committed)throw new Error('Not enough points');
      }
      var tr=await db.ref('rp/tasks/'+id).transaction(function(x){if(!x||(x.used||0)>=x.limit)return;x.used=(x.used||0)+1;return x});
      if(!tr.committed){if(viaPts)uref().child('points').transaction(function(p){return (p||0)+CONFIG.unlockCost});throw new Error('This task is finished')}
      var code=(await db.ref('rp/codes/'+id).once('value')).val()||'';
      var up={};up['done/'+id]=true;await uref().update(up);
      uref().child('unlocked').transaction(function(n){return (n||0)+1});
      var x=tr.snapshot.val();if(x&&x.used>=x.limit)db.ref('rp/tasks/'+id).remove();
      showCode(t,code);
    }catch(e){toast(e.message||'Failed',true);S.busy=false;draw();return}
    S.busy=false;
  }
  draw();
}
function showCode(t,code){
  var cv=$('#codeView'),left=CONFIG.codeOpenSec;
  cv.innerHTML='<div class="in"><div class="card task"><h3 class="th">'+LOGO+'<span>Code Unlocked</span></h3><p>'+esc(t.title)+'</p></div>'+
   '<div class="codebox">'+esc(code)+'</div><div class="cd" id="cdTxt"></div>'+
   '<div class="btns" style="max-width:none"><button class="btn b-gold" id="cvCopy">Copy</button><button class="btn b-dark" id="cvBack2">'+IC.back+' Back</button></div></div>';
  $('#cvCopy').onclick=function(){copy(code)};
  $('#cvBack2').onclick=function(){go('home')};
  function tick(){$('#cdTxt').textContent='Going to Home in '+left+'s';if(left--<=0)go('home')}
  tick();S.cd=setInterval(tick,1000);
}

/* Admin */
$('#pwNo').onclick=function(){$('#pwModal').hidden=true};
$('#pwOk').onclick=function(){
  if($('#pwIn').value.trim()===CONFIG.adminPassword){$('#pwModal').hidden=true;['aTitle','aDesc','aCode','aQty'].forEach(function(i){$('#'+i).value=''});$('#admModal').hidden=false}
  else toast('Wrong password',true);
};
$('#aClose').onclick=function(){$('#admModal').hidden=true};
$('#aPub').onclick=async function(){
  var title=$('#aTitle').value.trim(),desc=$('#aDesc').value.trim(),code=$('#aCode').value.trim(),qty=parseInt($('#aQty').value,10);
  if(!title||!code||!(qty>0))return toast('Fill title, code and quantity',true);
  var b=$('#aPub');b.disabled=true;
  try{
    var ref=db.ref('rp/tasks').push();
    await db.ref('rp/codes/'+ref.key).set(code);
    await ref.set({title:title,desc:desc,limit:qty,used:0,createdAt:TS});
    $('#admModal').hidden=true;toast('Published!');
  }catch(e){toast('Publish failed',true)}
  b.disabled=false;
};

/* Boot */
function startApp(tu){
  $('#gate').hidden=true;$('#app').hidden=false;$('#nav').hidden=false;
  $('#tLogo').innerHTML=LOGO;
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.onclick=function(){hap('tap');go(b.dataset.go)}});
  render();go('home');
  ensureUser(tu).catch(function(e){console.warn(e)});
  uref().on('value',function(s){S.user=s.val()||{};render()});
  db.ref('rp/tasks').on('value',function(s){S.tasks=s.val()||{};render()});
}
async function boot(){
  $('#sLogo').innerHTML=LOGO;$('#gLogo').innerHTML=LOGO.replace('<svg','<svg style="width:72px;height:72px"');
  try{tg&&(tg.ready(),tg.expand())}catch(e){}
  var t0=Date.now();
  var tu=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||(PREVIEW?{id:'preview',first_name:'Preview'}:null);
  if(tu)S.uid=String(tu.id);
  var joined=tu?(PREVIEW?true:await Promise.race([verify(false),sleep(4000).then(function(){return null})])):false;
  await sleep(Math.max(0,2200-(Date.now()-t0)));
  var sp=$('#splash');sp.classList.add('leave');setTimeout(function(){sp.hidden=true},420);
  if(!tu){$('#nogate').hidden=false;return}
  if(joined===true)return startApp(tu);
  $('#gate').hidden=false;
  if(joined===null)$('#gHint').textContent='Could not verify right now. Join and tap Verify.';
  $('#gJoin').onclick=function(){hap('tap');openLink(CONFIG.channelLink)};
  $('#gVerify').onclick=async function(){
    var b=$('#gVerify');b.disabled=true;b.innerHTML='<span class="sp"></span> Verifying';
    var r=await verify(true);
    if(r===true){toast('Verified!');startApp(tu);return}
    b.disabled=false;b.textContent='Verify';
    $('#gHint').textContent='Please join the channel first, then tap Verify.';
    toast('You have not joined yet',true);
  };
}
boot();
})();
</script>
